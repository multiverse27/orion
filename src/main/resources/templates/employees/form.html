<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${employee.id == null ? 'Crear Empleado' : 'Editar Empleado'} + ' - Andromeda'"></title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            margin-top: 60px;
        }
        .form-title {
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-control::placeholder {
            color: #adb5bd;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: space-between;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-secondary-custom {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }
        .btn-secondary-custom:hover {
            background: #5a6268;
            color: white;
            text-decoration: none;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-container {
                padding: 25px;
            }
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
            font-weight: 700;
        }
        .info-text {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-rocket"></i> ANDROMEDA
            </a>
        </div>
    </nav>

    <div class="form-container">
        <h1 class="form-title">
            <i th:class="${employee.id == null ? 'fas fa-plus-circle' : 'fas fa-edit'}"></i>
            <span th:text="${employee.id == null ? 'Crear Nuevo Empleado' : 'Editar Empleado'}"></span>
        </h1>

        <form th:action="@{/employees/save}" method="post" th:object="${employee}">
            <!-- Campo ID oculto para edición -->
            <input type="hidden" th:field="*{id}" th:if="*{id != null}" />

            <!-- Cédula -->
            <div class="form-group">
                <label for="cedula" class="form-label">
                    <i class="fas fa-id-card"></i>
                    <span class="required-field">Cédula de Identidad</span>
                </label>
                <input type="text" class="form-control" id="cedula" th:field="*{cedula}"
                       placeholder="Ingresa la cédula (Ej: 1234567890)" required>
                <div class="info-text">Este campo debe ser único</div>
            </div>

            <div class="form-row">
                <!-- Nombre -->
                <div class="form-group">
                    <label for="name" class="form-label">
                        <i class="fas fa-user"></i>
                        <span class="required-field">Nombre</span>
                    </label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           placeholder="Ej: Enrique" required>
                </div>

                <!-- Apellido -->
                <div class="form-group">
                    <label for="apellido" class="form-label">
                        <i class="fas fa-user"></i>
                        <span class="required-field">Apellido</span>
                    </label>
                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}"
                           placeholder="Ej: Vergara" required>
                </div>
            </div>

            <div class="form-row">
                <!-- Rol -->
                <div class="form-group">
                    <label for="role" class="form-label">
                        <i class="fas fa-briefcase"></i>
                        <span class="required-field">Rol</span>
                    </label>
                    <select class="form-control" id="role" th:field="*{role}" required>
                        <option value="">Selecciona un rol</option>
                        <option value="Developer">Developer</option>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                        <option value="Analyst">Analyst</option>
                        <option value="Designer">Designer</option>
                    </select>
                </div>

                <!-- Empresa -->
                <div class="form-group">
                    <label for="enterprise" class="form-label">
                        <i class="fas fa-building"></i>
                        <span class="required-field">Empresa</span>
                    </label>
                    <input type="text" class="form-control" id="enterprise" th:field="*{enterprise}"
                           placeholder="Ej: Londoño Gómez" required>
                </div>
            </div>

            <!-- Perfil -->
            <div class="form-group">
                <label for="profile" class="form-label">
                    <i class="fas fa-id-badge"></i>
                    <span class="required-field">Perfil de Usuario</span>
                </label>
                <input type="text" class="form-control" id="profile" th:field="*{profile}"
                       placeholder="Ej: kiikechavez" required>
                <div class="info-text">Nombre de usuario o handle único</div>
            </div>

            <!-- Botones de acción -->
            <div class="btn-container">
                <button type="submit" class="btn-primary-custom">
                    <i th:class="${employee.id == null ? 'fas fa-plus' : 'fas fa-save'}"></i>
                    <span th:text="${employee.id == null ? 'Crear Empleado' : 'Actualizar Empleado'}"></span>
                </button>
                <a href="/employees" class="btn-secondary-custom">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
